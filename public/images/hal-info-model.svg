<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 600" width="800" height="600">
  <title>HAL information model: a resource has a state, links and embedded resources</title>
  <style>
    /* Poppins Light (latin subset), embedded: an svg loaded as an image cannot load external fonts */
    @font-face {
      font-family: "Poppins";
      font-style: normal;
      font-weight: 300;
      src: url(data:font/woff2;base64,) format("woff2");
    }

    /* catppuccin latte palette */
    text {
      font-family: "Poppins", Helvetica, sans-serif;
      font-weight: 300;
      fill: #4c4f69; /* text */
      text-anchor: middle;
    }
    .box {
      fill: #eff1f5; /* base */
      stroke: #4c4f69; /* text */
      stroke-width: 1.5;
    }
    .line {
      fill: none;
      stroke: #4c4f69; /* text */
      stroke-width: 1;
    }
    .state {
      fill: #dc8a78; /* rosewater */
      fill-opacity: 0.45;
    }
    .links {
      fill: #04a5e5; /* sky */
      fill-opacity: 0.35;
    }
    .watermark {
      fill: #dc8a78; /* rosewater */
      fill-opacity: 0.6;
    }
    .outline {
      fill: none;
    }
    .cell {
      fill: #eff1f5; /* base */
    }
    .dots {
      fill: #4c4f69; /* text */
    }
  </style>

  <defs>
    <clipPath id="resource-clip">
      <rect x="30" y="94" width="700" height="432" rx="8" />
    </clipPath>
    <clipPath id="embedded-clip">
      <rect width="232" height="143" rx="4" />
    </clipPath>

    <!-- small resource, local coordinates: 232x143 -->
    <g id="embedded">
      <rect class="box" width="232" height="143" rx="4" />
      <g clip-path="url(#embedded-clip)">
        <rect class="state" width="115" height="73" />
        <rect class="links" x="115" width="117" height="73" />
      </g>
      <path class="line" d="M0 73H232M115 0V73" />
      <!-- links table: rel / href columns, 6 rows -->
      <rect class="cell" x="231" y="10" width="18" height="58" />
      <rect class="line" x="213" y="10" width="36" height="58" />
      <path class="line" stroke-width="0.5" d="M231 10V68M213 19.67H249M213 29.33H249M213 39H249M213 48.67H249M213 58.33H249" />
    </g>
  </defs>

  <text x="375" y="82" font-size="72">Resource</text>

  <!-- main resource -->
  <rect class="box" x="30" y="94" width="700" height="432" rx="8" />
  <g clip-path="url(#resource-clip)">
    <rect class="state" x="30" y="94" width="350" height="216" />
    <rect class="links" x="380" y="94" width="350" height="216" />
  </g>
  <path class="line" d="M30 310H730M380 94V310" />
  <rect class="box outline" x="30" y="94" width="700" height="432" rx="8" />

  <!-- resource state -->
  <text class="watermark" x="198" y="180" font-size="56">resource</text>
  <text class="watermark" x="198" y="262" font-size="56">state</text>
  <text x="203" y="208" font-size="15">{ plain old JSON properties }</text>

  <!-- links -->
  <text x="535" y="230" font-size="64">Links</text>
  <text x="702" y="119" font-size="14">rel</text>
  <text x="756" y="119" font-size="14">href</text>
  <rect class="cell" x="729" y="124" width="55" height="174" />
  <rect class="line" x="677" y="124" width="107" height="174" />
  <path class="line" d="M729 124V298M677 153H784M677 182H784M677 211H784M677 240H784M677 269H784" />

  <!-- embedded resources -->
  <text x="395" y="350" font-size="34">embedded resources</text>
  <use href="#embedded" xlink:href="#embedded" x="63" y="364" />
  <use href="#embedded" xlink:href="#embedded" x="333" y="364" />
  <g class="dots">
    <circle cx="609" cy="503" r="2.5" />
    <circle cx="622" cy="503" r="2.5" />
    <circle cx="635" cy="503" r="2.5" />
    <circle cx="648" cy="503" r="2.5" />
  </g>
</svg>
