<svg xmlns="http://www.w3.org/2000/svg" class="richardson" viewBox="0 0 800 540" width="800" height="540">
  <title>Richardson maturity model: a pyramid from level 0 (POX) to level 3 (HATEOAS)</title>
  <style>
    /* catppuccin latte palette, scoped: inlined in the page, these rules are global */
    .richardson text {
      font-family: "Poppins", Helvetica, sans-serif;
      fill: #eff1f5; /* base */
      text-anchor: middle;
    }
    .richardson .level {
      font-size: 20px;
      font-weight: 300;
    }
    .richardson .label {
      font-size: 30px;
      font-weight: 600;
    }
    .richardson .level-0 path { fill: #179299; /* teal */ }
    .richardson .level-1 path { fill: #1e66f5; /* blue */ }
    .richardson .level-2 path { fill: #8839ef; /* mauve */ }
    .richardson .level-3 path { fill: #e64553; /* maroon */ }
  </style>

  <!-- built bottom to top: level 0 first -->
  <g class="fragment level-0" data-fragment-index="0">
    <path d="M115 400H685L760 530H40Z" />
    <text class="level" x="400" y="447">Niveau 0</text>
    <text class="label" x="400" y="487">Le marais du POX</text>
  </g>

  <g class="fragment level-1" data-fragment-index="1">
    <path d="M190 270H610L681.5 394H118.5Z" />
    <text class="level" x="400" y="314">Niveau 1</text>
    <text class="label" x="400" y="354">Ressources</text>
  </g>

  <g class="fragment level-2" data-fragment-index="2">
    <path d="M265 140H535L606.5 264H193.5Z" />
    <text class="level" x="400" y="184">Niveau 2</text>
    <text class="label" x="400" y="224">Verbes HTTP</text>
  </g>

  <g class="fragment level-3" data-fragment-index="3">
    <path d="M340 10H460L531.5 134H268.5Z" />
    <text class="level" x="400" y="54">Niveau 3</text>
    <text class="label" x="400" y="94">HATEOAS</text>
  </g>
</svg>
