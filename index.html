<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/love.svg" />

    <title>HATEOAS+SPA, une histoire d'amour</title>

  <body>
    <!-- shared gradient for mermaid diagrams that don't support useGradient (sequence) -->
    <!-- size 0 instead of display:none, hidden svg gradients are not rendered -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <linearGradient id="mermaid-border-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#8839ef" /><!-- latte mauve -->
        <stop offset="100%" stop-color="#ea76cb" /><!-- latte pink -->
      </linearGradient>
    </svg>
    <div class="reveal">
      <div class="slides">
        <section
          data-markdown="hateoas-a-love-story.md"
          data-separator="^---"
          data-separator-vertical="^\n\n"
          data-separator-notes="^Notes:\n"
          data-charset="UTF-8"
        ></section>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
